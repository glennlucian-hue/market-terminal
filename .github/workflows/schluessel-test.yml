# ==========================================================================
#  Schlüssel-Test: prüft, ob alle Datenquellen mit deinen API-Schlüsseln funktionieren.
#  Gibt nur "funktioniert" oder einen Fehlergrund aus – niemals die Schlüssel selbst.
#  Starten: Reiter "Actions" -> "Schlüssel-Test" -> "Run workflow" (läuft auch bei Änderungen in kern/).
# ==========================================================================
name: Schlüssel-Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["kern/**", ".github/workflows/schluessel-test.yml"]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Datenquellen prüfen
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEXBOT_API_KEY: ${{ secrets.GEXBOT_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_KONTAKT: ${{ secrets.SEC_KONTAKT }}
        run: python -m kern.pruefung
