# --------------------------------------------------------------------------
#  Szenarien (Horizont 12 Monate) – alle Annahmen hier anpassbar
# --------------------------------------------------------------------------
#  Kursziel = Run-Rate-Umsatz in 12 Monaten x Umsatz-Multiplikator / Anzahl Aktien
#    wachstum_pro_quartal: angenommenes Wachstum der Run-Rate je Quartal (0.10 = 10 %)
#    multiplikator: "auto" = aus Vergleichsfirmen (Perzentil), oder eine feste Zahl, z. B. 12
#    perzentil: welches Perzentil der Vergleichsfirmen (25 = vorsichtig, 50 = Median, 75 = optimistisch)
#    ersatz_multiplikator: wird verwendet, wenn keine Vergleichsdaten geladen werden konnten
szenarien:
  bear:
    titel: Bear
    wachstum_pro_quartal: 0.05
    multiplikator: auto
    perzentil: 25
    ersatz_multiplikator: 8
    begruendung: >
      Wachstum bremst stark ab (Konkurrenz, Preisdruck bei KI-Modellen, Abhängigkeit von
      Cloud-Marktplätzen). Hohe Rechenzentrumskosten drücken die Marge, der Markt bewertet
      wie ein reifes Software-Unternehmen. Schwaches Umfeld für Tech-Aktien.
  neutral:
    titel: Neutral
    wachstum_pro_quartal: 0.12
    multiplikator: auto
    perzentil: 50
    ersatz_multiplikator: 12
    begruendung: >
      Wachstum normalisiert sich deutlich unter das bisherige Tempo, bleibt aber hoch.
      Bewertung im Mittelfeld grosser KI- und Software-Firmen.
  bull:
    titel: Bull
    wachstum_pro_quartal: 0.22
    multiplikator: auto
    perzentil: 75
    ersatz_multiplikator: 18
    begruendung: >
      Die Nachfrage nach Claude (Unternehmen, Programmierung, Agenten) wächst weiter sehr
      schnell, operative Gewinnschwelle wird nachhaltig erreicht. Der Markt zahlt einen Aufschlag
      wie für die wachstumsstärksten KI-Firmen.
  wahrscheinlichkeiten: {bull: 25, neutral: 50, bear: 25}   # in %, Grundeinstellung

